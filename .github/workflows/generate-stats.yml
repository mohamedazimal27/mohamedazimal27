name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:         # Manual trigger
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats Card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=mohamedazimal27&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&rank_icon=github" > stats.svg

      - name: Generate Top Languages Card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=mohamedazimal27&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" > top-langs.svg

      - name: Generate Streak Card
        run: |
          curl -s "https://streak-stats.demolab.com?user=mohamedazimal27&theme=tokyonight&hide_border=true" > streak.svg

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update GitHub stats SVGs" && git push)
